[project]
name = "web"
version = "1"
description = "Conversational HTML/CSS editor using CrewAI and Groq"
authors = [
    { name = "Naimur Rahman Lam", email = "lam@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,litellm]>=1.15.9,<2.0.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "python-dotenv>=1.0,<2.0",
    "html5lib>=1.1,<2.0",
    "tinycss2>=1.2.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
web = "web.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]